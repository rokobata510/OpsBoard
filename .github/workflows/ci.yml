name: CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres: 
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d opsboard_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Initialize test database
        run: psql "$DATABASE_URL" -f db/init.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsboard_test

      - name: Run tests
        run: pytest
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opsboard_test
          JWT_SECRET: test-secret

      - name: Build Docker image
        run: docker build -t opsboard-api:${{ github.sha }} .
